<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanSun</title><style>
:root{--ok:#18a957;--warn:#f3b11f;--bad:#df3b3b;--bg:#0e1a22;--card:#142633;--txt:#e7f2f9;--muted:#9fc0d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{padding:12px;max-width:860px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:var(--card);border-radius:12px;padding:12px}.big{font-size:1.9rem;font-weight:700}.status{display:flex;gap:10px;align-items:center}.sun{width:42px;height:42px;border-radius:50%;background:#f9dd50;box-shadow:0 0 0 6px #f9dd5040;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h2,h3{margin:.2rem 0 .35rem}small{color:var(--muted);font-size:.95rem}
.bars{height:160px;display:grid;grid-template-columns:repeat(24,1fr);align-items:end;gap:2px;padding-top:12px}.bar{height:6%;background:#2d4759;border-radius:3px 3px 0 0;position:relative}.bar>i{position:absolute;left:0;right:0;bottom:0;background:#3ca9dd;border-radius:3px 3px 0 0}.bar>span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}
.wbars{height:170px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;padding-top:10px}.wbar{height:6%;background:#2d4759;border-radius:5px 5px 0 0;position:relative}.wbar>i{position:absolute;left:0;right:0;bottom:0;background:#58c972;border-radius:5px 5px 0 0}.wbar>span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.gwrap{display:grid;place-items:center}.gauge{--val:0;--gcol:var(--bad);width:170px;height:170px;border-radius:50%;background:conic-gradient(from 180deg,var(--gcol) calc(var(--val)*1%),#375264 0);position:relative}.gauge:before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--card)}.gauge:after{content:attr(data-val);position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem;font-weight:700}.phrases{margin:0;padding-left:18px}li{margin:6px 0}
@media (max-width:420px){.big{font-size:1.7rem}.gauge{width:150px;height:150px}}
</style></head><body><main>
<section class="card status"><div class="sun"></div><div><h2 id="statusText">Carregando...</h2><small id="prText">PR --</small><br><small id="conn">Conectando...</small></div></section>
<section class="grid"><article class="card"><div>Gerado Hoje</div><div id="kwh" class="big">0.00</div><small>kWh</small></article><article class="card"><div>Economizado Hoje</div><div id="rs" class="big">0.00</div><small>R$</small></article><article class="card"><div>Enviado à Rede</div><div id="exp" class="big">0.00</div><small>kWh</small></article></section>
<section class="card"><h3>Geração hora a hora</h3><div id="bars" class="bars"></div></section>
<section class="card"><h3>Histórico semanal (kWh)</h3><div id="weekBars" class="wbars"></div></section>
<section class="card"><h3>Autoconsumo</h3><div class="gwrap"><div id="gauge" class="gauge" data-val="0.0%"></div></div></section>
<section class="card"><h3>Frases automáticas</h3><ul id="phrases" class="phrases"></ul></section>
</main><script>
const c=(id)=>document.getElementById(id),ok='var(--ok)',wn='var(--warn)',bd='var(--bad)';
const col=(s)=>s==='NORMAL'?ok:s==='ATENCAO'?wn:bd;
function bars(h){let e=Object.values(h||{}),m=Math.max(1,...e),out='';for(let i=0;i<24;i++){let v=h?.[i]||0,p=Math.max(4,(v/m)*100);out+=`<div class='bar'><i style='height:${p}%'></i><span>${i}</span></div>`}c('bars').innerHTML=out}
function week(rows){let days=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'],agg={};for(const r of (rows||[])){const d=new Date((r.timestamp||0)*1000);const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();agg[k]=(agg[k]||{lab:days[d.getDay()],g:0});agg[k].g+=Number(r.geracao_kwh||0)};const vals=Object.values(agg).slice(-7);const m=Math.max(1,...vals.map(v=>v.g));let out='';for(let i=0;i<7;i++){const v=vals[i]||{lab:'-',g:0},p=Math.max(4,(v.g/m)*100);out+=`<div class='wbar'><i style='height:${p}%'></i><span>${v.lab}</span></div>`}c('weekBars').innerHTML=out}
function gauge(v){let a=Math.max(0,Math.min(100,v)),g=c('gauge');g.style.setProperty('--val',a);g.style.setProperty('--gcol',a>70?'#18a957':a>45?'#f3b11f':'#df3b3b');g.dataset.val=a.toFixed(1)+'%'}
function phrases(list){c('phrases').innerHTML=(list||[]).map(x=>`<li>${x}</li>`).join('')}
function applyData(d){const m=d.metrics||{},s=d.snapshot||{};c('statusText').textContent=m.status_text||'--';c('statusText').style.color=col(m.status);c('prText').textContent='Performance ratio: '+((m.performance_ratio||0).toFixed(2));c('kwh').textContent=(s.daily_gen_kwh||0).toFixed(2);c('rs').textContent=(m.economia_diaria_rs||0).toFixed(2);c('exp').textContent=(m.excedente_exportado_kwh||0).toFixed(2);bars(m.hourly);gauge(m.autoconsumo_pct||0);phrases(m.phrases)}
async function loadWeek(){try{const r=await fetch('/api/history?days=7');const d=await r.json();week(d.rows||[]);}catch(_){}}
async function poll(){try{const r=await fetch('/api/data');applyData(await r.json());c('conn').textContent='Atualização: polling';}catch(_){c('conn').textContent='Sem conexão local'}loadWeek();setTimeout(poll,5000)}
function sse(){if(!window.EventSource)return poll();const e=new EventSource('/api/events');e.onopen=()=>c('conn').textContent='Atualização: tempo real (SSE)';e.addEventListener('update',(v)=>{try{applyData(JSON.parse(v.data));loadWeek()}catch(_){}});e.onerror=()=>{c('conn').textContent='SSE indisponível, usando polling';e.close();poll()}}
sse();
</script></body></html>
