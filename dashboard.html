<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanSun</title><style>
:root{--ok:#18a957;--warn:#f3b11f;--bad:#df3b3b;--bg:#0e1a22;--card:#142633;--txt:#e7f2f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}main{padding:12px;max-width:860px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:var(--card);border-radius:12px;padding:12px}.big{font-size:1.8rem;font-weight:700}.status{display:flex;gap:10px;align-items:center}#sun{width:42px;height:42px;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}svg{width:100%}small{opacity:.85}</style></head><body><main>
<section class="card status"><svg id="sun" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#f9dd50"/><g stroke="#f9dd50" stroke-width="6"><line x1="50" y1="5" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="95"/><line x1="5" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="95" y2="50"/></g></svg><div><h2 id="statusText">Carregando...</h2><small id="prText">PR --</small><br><small id="conn">Conectando...</small></div></section>
<section class="grid"><article class="card"><div>Gerado Hoje</div><div id="kwh" class="big">0.0</div><small>kWh</small></article><article class="card"><div>Economizado Hoje</div><div id="rs" class="big">0.00</div><small>R$</small></article><article class="card"><div>Enviado à Rede</div><div id="exp" class="big">0.0</div><small>kWh</small></article></section>
<section class="card"><h3>Geração hora a hora</h3><svg id="bars" viewBox="0 0 500 160"></svg></section>
<section class="card"><h3>Autoconsumo</h3><svg id="gauge" viewBox="0 0 220 120"></svg></section>
<section class="card"><h3>Frases automáticas</h3><ul id="phrases"></ul></section>
</main><script>
const c=(id)=>document.getElementById(id);function colorBy(st){return st==='NORMAL'?'var(--ok)':st==='ATENCAO'?'var(--warn)':'var(--bad)'}
function gauge(v){const a=Math.max(0,Math.min(100,v));const x=20+1.8*a;c('gauge').innerHTML=`<path d='M20 100 A90 90 0 0 1 200 100' stroke='#355' stroke-width='14' fill='none'/><path d='M20 100 A90 90 0 0 1 ${x} 100' stroke='${a>70?'#18a957':a>45?'#f3b11f':'#df3b3b'}' stroke-width='14' fill='none'/><text x='110' y='95' text-anchor='middle' font-size='24'>${a.toFixed(1)}%</text>`}
function bars(h){const e=Object.values(h||{});const max=Math.max(1,...e);let out='';for(let i=0;i<24;i++){const v=h?.[i]||0,b=120*(v/max),x=8+i*20;out+=`<rect x='${x}' y='${130-b}' width='12' height='${b}' fill='#3ca9dd'/><text x='${x}' y='145' font-size='8'>${i}</text>`}c('bars').innerHTML=out}
function phrases(list){c('phrases').innerHTML=(list||[]).map(x=>`<li>${x}</li>`).join('')}
function applyData(d){const m=d.metrics||{},s=d.snapshot||{};c('statusText').textContent=m.status_text||'--';c('statusText').style.color=colorBy(m.status);c('prText').textContent=`Performance ratio: ${(m.performance_ratio||0).toFixed(2)}`;c('kwh').textContent=(s.daily_gen_kwh||0).toFixed(2);c('rs').textContent=(m.economia_diaria_rs||0).toFixed(2);c('exp').textContent=(m.excedente_exportado_kwh||0).toFixed(2);bars(m.hourly);gauge(m.autoconsumo_pct||0);phrases(m.phrases)}
async function fallbackPoll(){try{const r=await fetch('/api/data');applyData(await r.json());c('conn').textContent='Atualização: polling';}catch(_e){c('conn').textContent='Sem conexão local';}setTimeout(fallbackPoll,5000)}
function startSSE(){if(!window.EventSource){fallbackPoll();return;}const es=new EventSource('/api/events');es.onopen=()=>c('conn').textContent='Atualização: tempo real (SSE)';es.addEventListener('update',(ev)=>{try{applyData(JSON.parse(ev.data));}catch(_e){}});es.onerror=()=>{c('conn').textContent='SSE indisponível, usando polling';es.close();fallbackPoll();};}
startSSE();
</script></body></html>
